openapi: 3.1.0
info:
  title: Racehorse Training & Management System — Flow 2 Training API
  version: 0.1.0
  description: |
    CORE-005 contract. Owner: Tiến. Reviewers: Hoàng, Dũng; Long (interlock).
    STOMP topics and payloads: flow2-stomp.md.

    Sources: analysis/business-flows.md §FLOW 2 approved detailed flow (M1–M12, Subflow T, AF-1…AF-5, EF-1…EF-6);
    DEC-004; DEC-005; BR-12…BR-14, BR-19…BR-26, BR-D17…BR-D33; DEC-007 §3.1 (Groom pre-check gate);
    design/flow-2-ux-architecture-draft.md; database/schema.sql D04/D05.

    Conventions: identical to shared.openapi.yaml (CORE-003): envelope `{ success, data, error }`, ISO-8601 UTC,
    `x-roles` enforced by Spring Security, zero-based paging, no SYSTEM role.
    Assignment scope (role-feature-matrix §3a): a TRAINER acts only on programs with their open `trainer_assignment`;
    a WORK_RIDER only on sessions where `work_rider_user_id` = self. Out-of-scope ids → 403.

    Key rules:
    - Session status = schema CHECK: SCHEDULED, IN_PROGRESS, PAUSED, COMPLETED, INTERRUPTED. **BLOCKED is a derived flag**
      (`blocked` + `blockedReasons`), never a stored status.
    - LOCKED horse → 409 BUSINESS_RULE_VIOLATION with the Veterinarian's reason (BR-13, BR-D20) on program create, session
      create/edit and start. Availability is re-checked at scheduling time and at start (BR-14, EF-2).
    - Suitability uses 4 categories: A Medical Hard Block (never overridable, BR-D18), B Operational Hard Block (rider schedule
      conflict), C Warning (acknowledgement), D Recommendation Mismatch (reason). Under LIMITED a forbidden exercise is
      removed or replaced, never overridden (BR-D32).
    - Recommendations return labels + reasons only, **no numeric scores** (BR-D28, BR-D29, BR-D22).
    - Stop requires a reason; an INTERRUPTED session never becomes COMPLETED (BR-D23).
    - The Groom pre-session check is the start gate (DEC-007 §3.1, BR-21…23): no ALL_NORMAL check → cannot start;
      ABNORMAL leaves the session SCHEDULED and blocked. It never creates an incident. Incident reporting belongs to CORE-046
      and may reference the returned pre-session-check `id` as `preSessionCheckId` via the separate CORE-046
      IncidentReportModal → POST /api/incidents flow.
    - No race field is exposed: `horse_training_program.target_race_id` stays NULL and hidden (DEC-007 §3.3).
    - BR-26 (Head Trainer evaluation completes the session) is superseded by the approved detailed flow (DEC-004): the Work
      Rider finishes the session (M10) and the Trainer records the evaluation (M11).

    Step → operation mapping:
    | Step | Operations |
    |---|---|
    | M1 | GET /api/horses/{id} (CORE-004), GET /api/horses/{id}/training-availability (CORE-006), GET /api/horses/{id}/performance |
    | M2 | GET /api/horses/{id}/template-recommendations, GET /api/program-templates/{id} |
    | M2b, M3 | GET /api/horses/{id}/trainer-recommendations, POST /api/training-programs |
    | M4 | GET /api/training-programs?assignedToMe=true |
    | M5 | POST /api/training-sessions/suitability-check, POST /api/training-sessions/work-rider-recommendations, POST /api/training-sessions |
    | M6 | POST /api/training-sessions (notification SESSION_ASSIGNED to the Work Rider) |
    | M7 | GET /api/work-rider/assignments, GET /api/training-sessions/{id}, POST /api/training-sessions/{id}/start |
    | M8 | POST /api/training-sessions/{id}/metrics; STOMP /topic/sessions/{id}/metrics |
    | M9 | backend threshold evaluation; STOMP /topic/sessions/{id}/alerts |
    | M10 | POST /api/training-sessions/{id}/complete, POST /api/training-sessions/{id}/rider-feedback |
    | M11 | GET /api/training-sessions/{id}/result, POST /api/training-sessions/{id}/evaluation |
    | M12 | GET /api/training-programs/{id}/progress, PATCH …/status, PUT …/trainer-assignment, PUT …/phases, POST /api/adjustment-requests/{id}/approve or reject |
    | Subflow T | GET/POST /api/program-templates, GET /api/program-templates/{id}, POST …/versions, …/duplicate, …/archive |
    | AF-1 | PUT /api/training-sessions/{id}/exercises (suitability re-run) |
    | AF-2 | PUT /api/training-programs/{id}/trainer-assignment; GET /api/training-programs/{id}/history |
    | AF-3 | STOMP alerts (WARNING, not stored); POST /api/monitoring-alerts/{id}/acknowledge only for stored CRITICAL alerts |
    | AF-4 | POST /api/training-programs/{id}/adjustment-requests, GET /api/adjustment-requests, approve / reject |
    | AF-5 | suitability-check returns category A per exercise; PUT …/exercises to remove or replace |
    | EF-1 | 409 BUSINESS_RULE_VIOLATION on POST /api/training-programs and POST /api/training-sessions |
    | EF-2 | `blocked` + `blockedReasons` on session reads; 409 on start; notification SESSION_BLOCKED |
    | EF-3 | POST /api/monitoring-alerts/{id}/acknowledge (ACKNOWLEDGE / REDUCE_INTENSITY / PAUSE / STOP); Leader-authorized POST /api/training-sessions/{id}/reduce-intensity with explicit lower intensity; escalation to Vet |
    | EF-4 | recommendation lists with warnings; `riderWarningAcknowledged` on session create |
    | EF-5 | replaced by the Groom pre-session check gate (DEC-007): POST /api/training-sessions/{id}/pre-session-check |
    | EF-6 | POST /api/training-sessions/{id}/report-issue, POST …/stop; rider feedback and evaluation still allowed |

    Approved decisions: Q-32 Resume is Trainer-only; Q-33 Work Riders use Report Issue/Incident instead of Trainer
    Pause/Resume/Stop controls; Q-34 early start is not allowed and the Trainer must reschedule; Q-35 Trainers see sessions
    for assigned programs, with `trainerId` filtering available to the Head Trainer.
    Surface vocabulary, metric units/distance semantics, `currentExerciseOrder` derivation, alert escalation timing and the
    reduction operation's method/path/request body/session-state signature remain OPEN where not specified below.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Templates
    description: Program Template Library (Subflow T, DEC-005).
  - name: Programs
    description: Horse Training Programs (M2–M4, M12).
  - name: Adjustments
    description: Program Adjustment Requests (AF-4).
  - name: Exercises
    description: Exercise library.
  - name: Sessions
    description: Training sessions, suitability, lifecycle (M5–M10).
  - name: Groom
    description: Pre-session check gate (DEC-007 §3.1).
  - name: Work Rider
    description: Assignments, history, rider feedback.
  - name: Realtime
    description: Metrics, simulator, alerts (M8–M9, EF-3).
  - name: Evaluation
    description: Session result, evaluation, performance (M11).

paths:
  # ===================== Templates =====================
  /api/program-templates:
    get:
      tags: [Templates]
      operationId: listProgramTemplates
      summary: Program Template Library (SCR-TRAIN-030)
      description: A Trainer may list only the source templates of programs assigned to them (read-only, BR-D33).
      x-roles: [HEAD_TRAINER, TRAINER, CLUB_MANAGER]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TemplateStatus' } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of templates (latest version summary).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/TemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Templates]
      operationId: createProgramTemplate
      summary: Create a template (version 1, ACTIVE)
      description: Creates `training_program_template` (generated `templateCode`) and its first immutable `template_version` with phases and required skills. Audit `TEMPLATE_CREATED`.
      x-roles: [HEAD_TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateVersionRequest' }
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/TemplateDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/program-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Templates]
      operationId: getProgramTemplate
      summary: Template detail (SCR-TRAIN-031; read-only for a Trainer)
      parameters:
        - { name: versionNo, in: query, description: Defaults to the latest version., schema: { type: integer, minimum: 1 } }
      x-roles: [HEAD_TRAINER, TRAINER, CLUB_MANAGER]
      responses:
        '200':
          description: Template with the requested version and the version list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/TemplateDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/program-templates/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Templates]
      operationId: saveTemplateVersion
      summary: Edit = save a new version (BR-D27)
      description: Inserts a new immutable version (`versionNo` + 1). Existing Horse Programs keep their pinned version. ARCHIVED template → 409. Audit `TEMPLATE_VERSION_SAVED`.
      x-roles: [HEAD_TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateVersionRequest' }
      responses:
        '201':
          description: New version.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/TemplateDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/program-templates/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Templates]
      operationId: duplicateProgramTemplate
      summary: Duplicate a template (new template, version 1, duplicated_from set)
      x-roles: [HEAD_TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 150 }
                sourceVersionNo: { type: integer, minimum: 1, description: Defaults to the latest version. }
      responses:
        '201':
          description: Duplicate created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/TemplateDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/program-templates/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Templates]
      operationId: archiveProgramTemplate
      summary: Archive a template (never hard-deleted, BR-D26)
      description: ARCHIVED templates are not selectable for new programs; existing programs stay valid. Already archived → 409.
      x-roles: [HEAD_TRAINER]
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/TemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/horses/{id}/template-recommendations:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Templates]
      operationId: getTemplateRecommendations
      summary: Recommended templates for a horse (M2, BR-D28)
      description: ACTIVE templates only, each with a label and reasons. No numeric score is computed or returned.
      x-roles: [HEAD_TRAINER]
      responses:
        '200':
          description: Recommendations, best label first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TemplateRecommendation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===================== Programs =====================
  /api/training-programs:
    get:
      tags: [Programs]
      operationId: listTrainingPrograms
      summary: Horse Training Programs (SCR-TRAIN-001; Trainer SCR-TRAIN-016 assigned list)
      description: A Trainer always gets only programs assigned to them, whatever the filters.
      x-roles: [HEAD_TRAINER, TRAINER, CLUB_MANAGER, VETERINARIAN, GROOM]
      parameters:
        - { name: horseId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProgramStatus' } }
        - { name: trainerId, in: query, schema: { type: integer, format: int64 } }
        - { name: assignedToMe, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of programs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/ProgramSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Programs]
      operationId: createTrainingProgram
      summary: Create and activate a Horse Training Program from a template (M2b–M3, SCR-TRAIN-003 wizard)
      description: |
        Checks (BR-12, BR-13, BR-D20): horse ACTIVE; Training Availability not LOCKED (409 with the Vet reason); template
        version belongs to an ACTIVE template; phases inside the program period and non-overlapping; trainer holds TRAINER.
        One transaction creates the program (ACTIVE, `activated_at` now, pinned `templateVersionId`), its phases and the open
        trainer assignment. The template is never modified (BR-D25). Notification PROGRAM_ASSIGNED to the Trainer.
        Audit `PROGRAM_CREATED`, `TRAINER_ASSIGNED`.
      x-roles: [HEAD_TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProgramRequest' }
      responses:
        '201':
          description: Program created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ProgramDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Locked' }

  /api/training-programs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Programs]
      operationId: getTrainingProgram
      summary: Program detail (SCR-TRAIN-002)
      x-roles: [HEAD_TRAINER, TRAINER, CLUB_MANAGER, VETERINARIAN, GROOM]
      responses:
        '200':
          description: Program.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ProgramDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/training-programs/{id}/progress:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Programs]
      operationId: getProgramProgress
      summary: Program progress aggregated across sessions (M12, SCR-TRAIN-022)
      x-roles: [HEAD_TRAINER, TRAINER, CLUB_MANAGER]
      responses:
        '200':
          description: Progress.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ProgramProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/training-programs/{id}/history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Programs]
      operationId: getProgramHistory
      summary: Program change history (AF-2, AF-4, M12)
      description: Read model over trainer assignments, adjustment requests, phase changes and status changes. Completed sessions stay attributed to the Trainer who ran them (AF-2).
      x-roles: [HEAD_TRAINER, TRAINER, CLUB_MANAGER]
      responses:
        '200':
          description: Entries, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProgramHistoryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/training-programs/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Programs]
      operationId: setProgramStatus
      summary: Continue / pause / complete a program (M12)
      description: ACTIVE ⇄ PAUSED; ACTIVE or PAUSED → COMPLETED (terminal). Resuming to ACTIVE re-checks LOCKED (409). Audit `PROGRAM_STATUS_CHANGED`.
      x-roles: [HEAD_TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ProgramStatus' }
                reason: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200':
          description: Updated program.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ProgramDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/training-programs/{id}/trainer-assignment:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Programs]
      operationId: reassignTrainer
      summary: Change the program's Trainer (AF-2)
      description: Closes the open assignment and opens a new one in one transaction (ux_trainer_assignment__open_per_program). Notifications to both Trainers. Audit `TRAINER_ASSIGNED`.
      x-roles: [HEAD_TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainerAssignmentRequest' }
      responses:
        '200':
          description: Updated program.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ProgramDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/training-programs/{id}/phases:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Programs]
      operationId: adjustProgramPhases
      summary: Head Trainer adjusts phases / workload (M12; applies an approved AF-4 request)
      description: |
        ADDITION beyond the CORE-005 playbook API list: M12 "adjust (phase, workload)" and AF-4 "approved changes apply to the
        Horse Training Program" need a write path, and `requested_value` is free text that cannot be applied automatically.
        Replaces the program's phase list (keeps ids of retained phases; phases with sessions cannot be removed → 409).
        Never touches the template. Marks changed phases `isCustomized`. Audit `PROGRAM_PHASES_ADJUSTED`.
      x-roles: [HEAD_TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phases]
              properties:
                adjustmentRequestId: { type: [integer, 'null'], format: int64, description: "The APPROVED request being applied, if any." }
                phases:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ProgramPhaseInput' }
      responses:
        '200':
          description: Updated program.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ProgramDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/horses/{id}/trainer-recommendations:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Programs]
      operationId: getTrainerRecommendations
      summary: Trainer candidates for a horse and template version (M3, BR-D29)
      description: Labels + reasons + warnings; no numeric score. An empty list carries a reason (EF-4). The Head Trainer decides.
      x-roles: [HEAD_TRAINER]
      parameters:
        - { name: templateVersionId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Candidates.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/CandidateList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===================== Adjustments =====================
  /api/training-programs/{id}/adjustment-requests:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Adjustments]
      operationId: createAdjustmentRequest
      summary: Trainer requests a strategic change (AF-4, BR-D31)
      description: Status PENDING. Trainer reassignment is not requestable (Q-39). No withdraw (Q-40). Notification ADJUSTMENT_REQUEST_SUBMITTED to the Head Trainer.
      x-roles: [TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequestInput' }
      responses:
        '201':
          description: Request created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AdjustmentRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/adjustment-requests:
