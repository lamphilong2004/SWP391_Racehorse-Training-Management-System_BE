  # ===================== Sessions =====================
  /api/training-sessions:
    get:
      tags: [Sessions]
      operationId: listTrainingSessions
      summary: Session calendar / list (SCR-TRAIN-004, 019)
      description: |
        Scope: Trainer = sessions of assigned programs (Q-35 approved); Work Rider = own sessions; Groom = assigned/notified
        sessions through /api/groom/sessions; Head Trainer, Club Manager, Veterinarian = all (read). `trainerId` filter is
        available to the Head Trainer.
      x-roles: [HEAD_TRAINER, TRAINER, WORK_RIDER, CLUB_MANAGER, VETERINARIAN]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: trainerId, in: query, schema: { type: integer, format: int64 } }
        - { name: horseId, in: query, schema: { type: integer, format: int64 } }
        - { name: programId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SessionStatus' } }
      responses:
        '200':
          description: Sessions in the range.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SessionSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sessions]
      operationId: createTrainingSession
      summary: Create and schedule a session (M5–M6, SCR-TRAIN-006 wizard)
      description: |
        Server re-runs every check (never trusts the client): program ACTIVE; phase belongs to the program; scheduled time
        inside the phase dates; Availability not LOCKED (409 with Vet reason); each exercise not category A (409 with
        per-exercise details); rider is a WORK_RIDER without a schedule conflict (category B → 409); category C/D exercises
        need `acknowledgementNote`; rider warnings need `riderWarningAcknowledged` (recorded as an audit event — DB-01 has no
        column for it); intensity within the phase range (BR-D30). Creates the session SCHEDULED (generated `sessionCode`)
        and its exercises with `suitabilityCategory`. Notification SESSION_ASSIGNED to the Work Rider.
        Audit `SESSION_CREATED`.
      x-roles: [TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Session scheduled.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/SessionDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SuitabilityBlocked' }

  /api/training-sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Sessions]
      operationId: getTrainingSession
      summary: Session detail (SCR-TRAIN-008 / 020 / 021)
      description: GROOM access is limited to the assigned/notified Groom for pre-session work; the assignment persistence mapping is a model gap and must not be widened.
      x-roles: [HEAD_TRAINER, TRAINER, WORK_RIDER, GROOM, CLUB_MANAGER, VETERINARIAN]
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sessions]
      operationId: updateSessionBasics
      summary: Reschedule / change rider, surface, focus, intensity (BR-D30)
      description: |
        ADDITION beyond the CORE-005 playbook API list: BR-D30 lets the Trainer change session date/time, surface, focus,
        intensity (within the phase range) and the Work Rider. SCHEDULED only. Same LOCKED / rider-conflict / intensity
        checks as create. Notifies the old and new rider when the rider changes.
      x-roles: [TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSessionRequest' }
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/SessionDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SuitabilityBlocked' }

  /api/training-sessions/{id}/exercises:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Sessions]
      operationId: replaceSessionExercises
      summary: Change exercises after scheduling (AF-1, AF-5 remove/replace)
      description: SCHEDULED only. Re-runs suitability against the current horse state; category A → 409; C/D need acknowledgement notes.
      x-roles: [TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exercises]
              properties:
                exercises:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/SessionExerciseInput' }
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/SessionDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SuitabilityBlocked' }

  /api/training-sessions/suitability-check:
    post:
      tags: [Sessions]
      operationId: checkSessionSuitability
      summary: Run the 4-category suitability check on a draft (M5 wizard, no side effects)
      x-roles: [TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionDraft' }
      responses:
        '200':
          description: Check result. A LOCKED horse returns `sessionBlocked = true` with the reason (no exercise detail).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/SuitabilityResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/training-sessions/work-rider-recommendations:
    post:
      tags: [Sessions]
      operationId: recommendWorkRidersForDraft
      summary: Work Rider candidates for a draft session (M5 wizard, BR-D22)
      description: |
        ADDITION beyond the playbook list: during the wizard the session does not exist yet, so the draft is posted.
        Schedule conflict = hard block (category B); other mismatches are warnings. Labels + reasons, no scores.
      x-roles: [TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionDraft' }
      responses:
        '200':
          description: Candidates.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/CandidateList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/training-sessions/{id}/work-rider-recommendations:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Sessions]
      operationId: recommendWorkRiders
      summary: Work Rider candidates for an existing session (rider change)
      x-roles: [TRAINER]
      responses:
        '200':
          description: Candidates.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/CandidateList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/training-sessions/{id}/start:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Sessions]
      operationId: startSession
      summary: Start a session (M7)
      description: |
        SCHEDULED → IN_PROGRESS, sets `actual_start`. Gate (409 BUSINESS_RULE_VIOLATION with `blockedReasons` in details):
        pre-session check missing or ABNORMAL (BR-21/22); Availability LOCKED (EF-2, Vet reason); an exercise now category A;
        program not ACTIVE; before `scheduledStart` (Q-34 approved: no early start; the Trainer must reschedule). Publishes STOMP state.
      x-roles: [WORK_RIDER, TRAINER]
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/training-sessions/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Sessions]
      operationId: pauseSession
      summary: Pause (EF-3; resumable, no reason needed)
      description: IN_PROGRESS → PAUSED.
      x-roles: [TRAINER]
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/training-sessions/{id}/reduce-intensity:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Sessions]
      operationId: reduceSessionIntensity
      summary: Reduce session intensity (Leader authorized 2026-10-21)
      description: |
        Leader-authorized implementation decision DEC-LOCAL-DEMO-20261021: assigned Trainer only, IN_PROGRESS or PAUSED,
        with a strictly lower intensity according to LOW < MEDIUM < MEDIUM_HIGH < HIGH. Transaction and session lock
        protect persisted state; current program, ALL_NORMAL precheck, phase bounds and medical gates still apply.
        Alert action REDUCE_INTENSITY uses this same operation atomically with acknowledgement.
      x-roles: [TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReduceIntensityRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/training-sessions/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Sessions]
      operationId: resumeSession
      summary: Resume a paused session (Q-32 approved — Trainer only)
      description: PAUSED → IN_PROGRESS. Re-checks LOCKED (409).
      x-roles: [TRAINER]
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/training-sessions/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Sessions]
      operationId: stopSession
      summary: Stop a session (EF-3 / EF-6; reason required → INTERRUPTED)
      description: |
        IN_PROGRESS or PAUSED → INTERRUPTED with `interruption_reason`, `actual_end`. If `medicallyRelevant`, an incident
        (REPORTED, linked to the session) is created for Veterinarian review — the Trainer never opens a medical case directly.
        Trainer only (Q-33 approved). Work Riders report issues through `/report-issue`.
      x-roles: [TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopSessionRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/training-sessions/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Sessions]
      operationId: completeSession
      summary: Finish the session normally (M10)
      description: IN_PROGRESS → COMPLETED, sets `actual_end`. An INTERRUPTED session can never be completed (409).
      x-roles: [WORK_RIDER]
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/training-sessions/{id}/report-issue:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Sessions]
      operationId: reportSessionIssue
      summary: Report an issue mid-session (EF-6, MF-12 in-session)
      description: |
        Creates an incident (REPORTED, `training_session_id` set) and notifies the Veterinarian and the Trainer
        (INCIDENT_REPORTED). An IN_PROGRESS or PAUSED session becomes INTERRUPTED with the description as reason (EF-6).
        Rider feedback and Trainer review remain available.
      x-roles: [WORK_RIDER, TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportIssueRequest' }
      responses:
        '201':
          description: Incident created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [incidentId, incidentCode, sessionStatus]
                        properties:
                          incidentId: { type: integer, format: int64 }
                          incidentCode: { type: string }
                          sessionStatus: { $ref: '#/components/schemas/SessionStatus' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  # ===================== Groom =====================
  /api/groom/sessions:
    get:
      tags: [Groom]
      operationId: listGroomSessions
      summary: Sessions needing a pre-session check (SCR-DASH-004 Groom Today)
      description: |
        SCHEDULED sessions on the Vietnam calendar date explicitly assigned to the signed-in Groom, including check state.
        The technical training_session_groom_assignment table is the authorization source. Notifications do not grant access.
        Leader-authorized DEC-LOCAL-DEMO-20261021 defines assignment and reassignment before the first check.
      x-roles: [GROOM]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SessionSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/training-sessions/{id}/pre-session-check:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Groom]
      operationId: submitPreSessionCheck
      summary: Pre-session check (SCR-TRAIN-007; BR-21…23)
      description: |
        SCHEDULED sessions only; one check per session (409 if it exists). Only the assigned/notified Groom may submit it;
        the assignment persistence mapping is a model gap and must not be widened to all Grooms. The backend computes
        `overallResult` from the five checklist results; clients do not send it. The five checklist items are stored as JSON
        in `pre_session_check.observations`, and `overallResult` is derived from those item results. ABNORMAL leaves the session SCHEDULED and
        blocks start. This operation never creates an Incident. Incident reporting is separate under CORE-046 and may reference the returned
        pre-session-check `id` as `preSessionCheckId` through the separate CORE-046 IncidentReportModal → POST /api/incidents
        flow.
      x-roles: [GROOM]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreSessionCheckRequest' }
      responses:
        '201':
          description: Check recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PreSessionCheck' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  # ===================== Work Rider =====================
  /api/work-rider/assignments:
    get:
      tags: [Work Rider]
      operationId: listMyAssignments
      summary: My upcoming and active rides (SCR-TRAIN-017, 027)
      x-roles: [WORK_RIDER]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SessionStatus' } }
      responses:
        '200':
          description: Own sessions in SCHEDULED, IN_PROGRESS or PAUSED (or the given status).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/work-rider/history:
    get:
      tags: [Work Rider]
      operationId: listMyRidingHistory
      summary: My riding history (SCR-TRAIN-029)
      x-roles: [WORK_RIDER]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Own COMPLETED and INTERRUPTED sessions, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/training-sessions/{id}/rider-feedback:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Work Rider]
      operationId: submitRiderFeedback
      summary: Rider feedback (SCR-TRAIN-018; COMPLETED or INTERRUPTED)
      description: Once per session (409). Answers are stored as JSON in `rider_feedback.responses`. Submitting never changes the session status (BR-D23).
      x-roles: [WORK_RIDER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiderFeedbackRequest' }
      responses:
        '201':
          description: Feedback recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/RiderFeedback' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  # ===================== Realtime =====================
  /api/training-sessions/{id}/metrics:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Realtime]
      operationId: submitMetricSample
      summary: Submit a manual metric sample (M8; system of record, DEC-002 D-03)
      description: |
        IN_PROGRESS or PAUSED. At least one value. Source MANUAL. The backend evaluates heart rate against the effective
        global medical threshold configuration combined with any applicable horse override. The exact merge semantics
        are not defined here. No universal threshold is hard-coded and the warning threshold is not derived from the
        critical threshold. Each transition from below to at/above the effective
        critical threshold creates one CRITICAL alert. Further samples above threshold do not create repeated alerts;
        another alert is eligible only after a sample falls below the threshold and crosses it again. WARNING is transient
        and is not stored (the schema stores CRITICAL only).
      x-roles: [WORK_RIDER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricSampleInput' }
      responses:
        '201':
          description: Sample stored and evaluated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/MetricSampleResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/simulator/sessions/{id}/start:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Realtime]
      operationId: startSimulator
      summary: Start the demo simulator for an IN_PROGRESS or PAUSED session
      description: Demo only (DEC-002 D-03). Feeds the same pipeline with source SIMULATOR for IN_PROGRESS or PAUSED sessions; resulting notifications have `isSimulated = true`. Disabled outside the dev/demo profile (404).
      x-roles: [TRAINER]
      responses:
        '204': { description: Simulator running. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/simulator/sessions/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Realtime]
      operationId: stopSimulator
      summary: Stop the demo simulator
      x-roles: [TRAINER]
      responses:
        '204': { description: Simulator stopped. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/monitoring-alerts/{id}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Realtime]
      operationId: acknowledgeAlert
      summary: Acknowledge a CRITICAL alert and choose the response (EF-3, SCR-TRAIN-012)
      description: |
        Sets `acknowledged_at/by` and `action_taken`. PAUSE also pauses the session; STOP requires `stopReason` and interrupts
        it (same rules as POST …/stop). REDUCE_INTENSITY records the alert response; the Trainer may use the proposed
        intensity-reduction operation (PROPOSED — NEEDS CONFIRMATION; see that operation). A Veterinarian may only
        ACKNOWLEDGE. Already acknowledged → 409.
        Unacknowledged alerts are escalated to the Veterinarian after a configured time (`escalated_to_vet_at`).
      x-roles: [TRAINER, VETERINARIAN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgeAlertRequest' }
      responses:
        '200':
          description: Alert acknowledged.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/MonitoringAlert' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  # ===================== Evaluation =====================
  /api/training-sessions/{id}/evaluation:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Evaluation]
      operationId: submitEvaluation
      summary: Trainer evaluation and recommendation (M11, SCR-TRAIN-009)
      description: COMPLETED or INTERRUPTED sessions; once per session (409). The status never changes (an INTERRUPTED session stays INTERRUPTED).
      x-roles: [TRAINER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluationRequest' }
      responses:
        '201':
          description: Evaluation recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/SessionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BusinessRule' }

  /api/training-sessions/{id}/result:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Evaluation]
      operationId: getSessionResult
      summary: Planned vs actual, metrics, alerts, rider feedback, evaluation (SCR-TRAIN-010)
      x-roles: [HEAD_TRAINER, TRAINER, WORK_RIDER, CLUB_MANAGER, VETERINARIAN]
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/SessionResultView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/horses/{id}/performance:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Evaluation]
      operationId: getHorsePerformance
      summary: Performance history of a horse (SCR-TRAIN-023)
      x-roles: [HEAD_TRAINER, TRAINER, CLUB_MANAGER, VETERINARIAN]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Per-session aggregates, oldest first (chart series).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PerformancePoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    SessionOk:
      description: Updated session.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/SessionDetail' }
    ValidationError:
      description: Field validation failed (VALIDATION_ERROR).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing, invalid or expired JWT.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Role not allowed, or outside the caller's assignment scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BusinessRule:
      description: Not allowed in the current state (BUSINESS_RULE_VIOLATION). `details` names each blocking reason.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Locked:
      description: Horse not ACTIVE, or Training Availability LOCKED — the Veterinarian's reason is shown (BR-13).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error:
              code: BUSINESS_RULE_VIOLATION
              message: 'Training is locked by the Veterinarian: suspected tendon strain, rest until re-examination.'
              details: [{ field: horseId, message: LOCKED }]
    SuitabilityBlocked:
      description: |
        LOCKED (whole session), category A exercise (Medical Hard Block, `field` = `exercises[i]`) or category B rider
        schedule conflict (`field` = `workRiderUserId`). Never overridable from this endpoint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error:
              code: BUSINESS_RULE_VIOLATION
              message: The session cannot be scheduled.
              details:
                - { field: 'exercises[2]', message: 'A · Medical hard block: Gallop is prohibited by the active restriction.' }

  schemas:
    # ---------- Envelope (mirrors CORE-001 com.racehorse.common.api; identical in every contract file) ----------
    Envelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: {}
        error: { $ref: '#/components/schemas/ApiError' }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { $ref: '#/components/schemas/ApiError' }
    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: [string, 'null'] }
        message: { type: string }
    ErrorCode:
      type: string
      enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, BUSINESS_RULE_VIOLATION, TOO_MANY_REQUESTS, INTERNAL_ERROR]
    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: integer, format: int64 }
        userCode: { type: string }
        fullName: { type: string }
    HorseRef:
      type: object
      required: [id, horseCode, name]
      properties:
        id: { type: integer, format: int64 }
        horseCode: { type: string }
        name: { type: string }

    # ---------- Vocabularies ----------
    TemplateStatus: { type: string, enum: [ACTIVE, ARCHIVED] }
    ProgramStatus: { type: string, enum: [ACTIVE, PAUSED, COMPLETED] }
    AdjustmentStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
    AdjustmentRequestType:
      type: string
      description: ck_program_adjustment_request__request_type. TARGET_RACE stays in the vocabulary but is not offered while races are deferred (DEC-007 §3.3).
      enum: [SOURCE_TEMPLATE, PRIMARY_GOAL, TARGET_RACE, PHASE_STRUCTURE, PHASE_OBJECTIVE, PHASE_WORKLOAD_INTENSITY, PHASE_TIMELINE, TOTAL_DURATION, OTHER_STRUCTURAL]
    SessionStatus:
      type: string
      description: Stored status (ck_training_session__status). BLOCKED is not a status — see `blocked`.
      enum: [SCHEDULED, IN_PROGRESS, PAUSED, COMPLETED, INTERRUPTED]
    TrainingAvailability: { type: string, enum: [AVAILABLE, LIMITED, LOCKED] }
    SuitabilityCategory:
      type: string
      description: A Medical Hard Block · B Operational Hard Block · C Warning · D Recommendation Mismatch.
      enum: [A, B, C, D]
    RecommendationLabel:
      type: string
      description: BR-D28 labels. Used for templates, trainers and riders. No numeric score exists.
      enum: [RECOMMENDED, SUITABLE, SUITABLE_WITH_CAUTION, NOT_RECOMMENDED]
    RealtimeState: { type: string, enum: [NORMAL, WARNING, CRITICAL] }
    AlertAction: { type: string, enum: [ACKNOWLEDGE, REDUCE_INTENSITY, PAUSE, STOP] }
    BlockedReason:
      type: string
      enum: [AVAILABILITY_LOCKED, PRE_CHECK_MISSING, PRE_CHECK_ABNORMAL, EXERCISE_MEDICAL_BLOCK, PROGRAM_NOT_ACTIVE]
    IncidentType: { type: string, enum: [OFF_FEED, COLIC_SIGNS, FEVER, HOOF_OR_LEG_PROBLEM, OTHER] }
    ObservedSeverity: { type: string, enum: [LOW, MEDIUM, HIGH] }
    Intensity:
      type: string
      description: Ordered values used for phase range checks and session intensity reduction.
      enum: [LOW, MEDIUM, MEDIUM_HIGH, HIGH]

    # ---------- Templates ----------
    TemplatePhaseInput:
      type: object
      required: [phaseOrder, name]
      properties:
        phaseOrder: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 150 }
        objective: { type: [string, 'null'], maxLength: 1000 }
        recommendedDuration: { type: [string, 'null'], maxLength: 100 }
        intensityGuidance: { type: [string, 'null'], maxLength: 500 }
    TemplatePhase:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
        - $ref: '#/components/schemas/TemplatePhaseInput'
    TemplateVersionRequest:
      type: object
      required: [name, phases]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        goals: { type: [string, 'null'], maxLength: 2000 }
        suitableHorseProfile: { type: [string, 'null'], maxLength: 1000 }
        recommendedDistanceUseCase: { type: [string, 'null'], maxLength: 500 }
        recommendedDuration: { type: [string, 'null'], maxLength: 100 }
        workloadIntensityGuidance: { type: [string, 'null'], maxLength: 1000 }
        preferredSurfaces: { type: [string, 'null'], maxLength: 500 }
        recoveryGuidance: { type: [string, 'null'], maxLength: 1000 }
        requiredSkillIds:
          type: array
          description: TRAINER_SPECIALIZATION skills.
          items: { type: integer, format: int64 }
        phases:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TemplatePhaseInput' }
    TemplateSummary:
      type: object
      required: [id, templateCode, status, latestVersionNo, name]
      properties:
        id: { type: integer, format: int64 }
        templateCode: { type: string, maxLength: 20 }
        status: { $ref: '#/components/schemas/TemplateStatus' }
        latestVersionNo: { type: integer, minimum: 1 }
        name: { type: string }
        goals: { type: [string, 'null'] }
        duplicatedFromTemplateId: { type: [integer, 'null'], format: int64 }
        usedByProgramCount: { type: integer, minimum: 0 }
    TemplateVersion:
      type: object
      required: [id, versionNo, name, phases, requiredSkills, createdAt]
      properties:
        id: { type: integer, format: int64 }
        versionNo: { type: integer, minimum: 1 }
        name: { type: string }
        goals: { type: [string, 'null'] }
        suitableHorseProfile: { type: [string, 'null'] }
        recommendedDistanceUseCase: { type: [string, 'null'] }
        recommendedDuration: { type: [string, 'null'] }
        workloadIntensityGuidance: { type: [string, 'null'] }
        preferredSurfaces: { type: [string, 'null'] }
        recoveryGuidance: { type: [string, 'null'] }
        requiredSkills:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        phases:
          type: array
          items: { $ref: '#/components/schemas/TemplatePhase' }
        createdBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
    TemplateDetail:
      type: object
      required: [template, version, versions]
      properties:
        template: { $ref: '#/components/schemas/TemplateSummary' }
        version: { $ref: '#/components/schemas/TemplateVersion' }
        versions:
          type: array
          items:
            type: object
            required: [id, versionNo, createdAt]
            properties:
              id: { type: integer, format: int64 }
              versionNo: { type: integer }
              createdAt: { type: string, format: date-time }
    TemplateRecommendation:
      type: object
      required: [templateId, templateCode, templateVersionId, versionNo, name, label, reasons]
      properties:
        templateId: { type: integer, format: int64 }
        templateCode: { type: string }
        templateVersionId: { type: integer, format: int64 }
        versionNo: { type: integer }
        name: { type: string }
        label: { $ref: '#/components/schemas/RecommendationLabel' }
        reasons:
          type: array
          items: { type: string }

    # ---------- Candidates (trainer / work rider) ----------
    Candidate:
      type: object
      required: [user, label, reasons, warnings, hardBlock]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        experienceLevel: { type: [string, 'null'] }
        skills:
          type: array
          items: { type: string }
        label: { $ref: '#/components/schemas/RecommendationLabel' }
        reasons:
          type: array
          items: { type: string }
        warnings:
          type: array
          description: Category C mismatches; selecting this candidate needs an acknowledgement (EF-4).
          items: { type: string }
        hardBlock:
          type: [string, 'null']
          description: Category B schedule conflict (Work Rider only). A hard-blocked candidate cannot be selected.
    CandidateList:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
        emptyReason: { type: [string, 'null'], description: Explains an empty or all-warned list (EF-4). }

    # ---------- Programs ----------
    ProgramPhaseInput:
      type: object
      required: [phaseOrder, name, startDate, endDate]
      properties:
        id: { type: [integer, 'null'], format: int64, description: Existing phase id when adjusting. }
        templateVersionPhaseId: { type: [integer, 'null'], format: int64 }
        phaseOrder: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 150 }
        objective: { type: [string, 'null'], maxLength: 1000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        intensityMin: { oneOf: [{ $ref: '#/components/schemas/Intensity' }, { type: 'null' }] }
        intensityMax: { oneOf: [{ $ref: '#/components/schemas/Intensity' }, { type: 'null' }] }
        workload: { type: [string, 'null'], maxLength: 500 }
    ProgramPhase:
      allOf:
        - type: object
          required: [id, isCustomized]
          properties:
            id: { type: integer, format: int64 }
            isCustomized: { type: boolean }
        - $ref: '#/components/schemas/ProgramPhaseInput'
    TrainerAssignmentRequest:
      type: object
      required: [trainerUserId, effectiveFrom]
      properties:
        trainerUserId: { type: integer, format: int64 }
        effectiveFrom: { type: string, format: date }
        reason: { type: [string, 'null'], maxLength: 500 }
        warningsAcknowledged: { type: boolean, default: false, description: Required when the candidate carries warnings (EF-4). }
    CreateProgramRequest:
      type: object
      description: No target race field (DEC-007 §3.3).
      required: [horseId, templateVersionId, name, periodStart, periodEnd, phases, trainer]
      properties:
        horseId: { type: integer, format: int64 }
        templateVersionId: { type: integer, format: int64, description: Pinned as source template + version (BR-D27). }
        name: { type: string, minLength: 1, maxLength: 150 }
        goals: { type: [string, 'null'], maxLength: 2000 }
        targetMetrics: { type: [string, 'null'], maxLength: 1000 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
        phases:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ProgramPhaseInput' }
        trainer: { $ref: '#/components/schemas/TrainerAssignmentRequest' }
    ProgramSummary:
      type: object
      required: [id, horse, name, status, periodStart, periodEnd, sourceTemplateId, sourceTemplateVersion]
      properties:
        id: { type: integer, format: int64 }
        horse: { $ref: '#/components/schemas/HorseRef' }
        name: { type: string }
        status: { $ref: '#/components/schemas/ProgramStatus' }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        sourceTemplateId: { type: integer, format: int64 }
        sourceTemplateVersion: { type: integer }
        currentTrainer: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        currentPhaseName: { type: [string, 'null'] }
        trainingAvailability: { $ref: '#/components/schemas/TrainingAvailability' }
    ProgramDetail:
      allOf:
        - $ref: '#/components/schemas/ProgramSummary'
        - type: object
          required: [phases, activatedAt]
          properties:
            sourceTemplateCode: { type: string }
            sourceTemplateName: { type: string }
            goals: { type: [string, 'null'] }
            targetMetrics: { type: [string, 'null'] }
            notes: { type: [string, 'null'] }
            activatedAt: { type: string, format: date-time }
            createdBy: { $ref: '#/components/schemas/UserRef' }
            phases:
              type: array
              items: { $ref: '#/components/schemas/ProgramPhase' }
            pendingAdjustmentRequests: { type: integer, minimum: 0 }
    ProgramProgress:
      type: object
      required: [programId, phases]
      properties:
        programId: { type: integer, format: int64 }
        phases:
          type: array
          items:
            type: object
            required: [phaseId, phaseOrder, name, scheduled, completed, interrupted]
            properties:
              phaseId: { type: integer, format: int64 }
              phaseOrder: { type: integer }
              name: { type: string }
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
              scheduled: { type: integer, minimum: 0 }
              completed: { type: integer, minimum: 0 }
              interrupted: { type: integer, minimum: 0 }
              totalDistanceM: { type: [number, 'null'], description: Field name denotes metres; aggregation semantics remain OPEN pending approval. }
              lastEvaluationLabel: { type: [string, 'null'] }
    ProgramHistoryEntry:
      type: object
      required: [occurredAt, entryType, summary]
      properties:
        occurredAt: { type: string, format: date-time }
        entryType:
          type: string
          enum: [CREATED, TRAINER_ASSIGNED, STATUS_CHANGED, PHASES_ADJUSTED, ADJUSTMENT_REQUESTED, ADJUSTMENT_APPROVED, ADJUSTMENT_REJECTED]
        actor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        summary: { type: string }

    # ---------- Adjustments ----------
    AdjustmentRequestInput:
      type: object
      required: [requestType, requestedValue, reason]
      properties:
        horseProgramPhaseId: { type: [integer, 'null'], format: int64 }
        requestType: { $ref: '#/components/schemas/AdjustmentRequestType' }
        currentValue: { type: [string, 'null'], maxLength: 1000 }
        requestedValue: { type: string, minLength: 1, maxLength: 1000 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidenceNotes: { type: [string, 'null'], maxLength: 2000 }
    AdjustmentRequest:
      allOf:
        - $ref: '#/components/schemas/AdjustmentRequestInput'
        - type: object
          required: [id, programId, status, requestedBy, requestedAt]
          properties:
            id: { type: integer, format: int64 }
            programId: { type: integer, format: int64 }
            horse: { $ref: '#/components/schemas/HorseRef' }
            status: { $ref: '#/components/schemas/AdjustmentStatus' }
            requestedBy: { $ref: '#/components/schemas/UserRef' }
            requestedAt: { type: string, format: date-time }
            reviewedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
            reviewedAt: { type: [string, 'null'], format: date-time }
            decisionReason: { type: [string, 'null'] }

    # ---------- Exercises ----------
    ExerciseInput:
      type: object
      description: No default intensity is stored on an exercise definition.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        exerciseType: { type: [string, 'null'], maxLength: 50, examples: [Walk, Trot, Canter, Gallop] }
        description: { type: [string, 'null'], maxLength: 2000 }
        targetMetric: { type: [string, 'null'], maxLength: 100 }
    Exercise:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
        - $ref: '#/components/schemas/ExerciseInput'

    # ---------- Sessions ----------
    SessionExerciseInput:
      type: object
      required: [exerciseDefinitionId, exerciseOrder]
      properties:
        exerciseDefinitionId: { type: integer, format: int64 }
        exerciseOrder: { type: integer, minimum: 1 }
        distanceM: { type: [number, 'null'], minimum: 0, description: Field name denotes metres; exact business meaning remains OPEN pending approval. }
        durationMin: { type: [number, 'null'], minimum: 0, description: ASSUMPTION unit minutes. }
        repetitions: { type: [integer, 'null'], minimum: 0 }
        restIntervalMin: { type: [number, 'null'], minimum: 0, description: ASSUMPTION unit minutes. }
        intensity: { oneOf: [{ $ref: '#/components/schemas/Intensity' }, { type: 'null' }] }
        surface: { type: [string, 'null'], maxLength: 50 }
        acknowledgementNote:
          type: [string, 'null']
          maxLength: 1000
          description: Required for category C (acknowledgement) and D (reason). Never accepted for category A (ck_session_exercise__no_ack_for_category_a).
    SessionDraft:
      type: object
      required: [horseProgramPhaseId, scheduledStart, exercises]
      properties:
        horseProgramPhaseId: { type: integer, format: int64 }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: [string, 'null'], format: date-time }
        intensity: { oneOf: [{ $ref: '#/components/schemas/Intensity' }, { type: 'null' }] }
        workRiderUserId: { type: [integer, 'null'], format: int64 }
        exercises:
          type: array
          items: { $ref: '#/components/schemas/SessionExerciseInput' }
    CreateSessionRequest:
      type: object
      required: [horseProgramPhaseId, scheduledStart, workRiderUserId, exercises]
      properties:
        horseProgramPhaseId: { type: integer, format: int64 }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: [string, 'null'], format: date-time }
        surface: { type: [string, 'null'], maxLength: 50 }
        focus: { type: [string, 'null'], maxLength: 200 }
        intensity: { oneOf: [{ $ref: '#/components/schemas/Intensity' }, { type: 'null' }] }
        workRiderUserId: { type: integer, format: int64 }
        riderWarningAcknowledged: { type: boolean, default: false }
        exercises:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SessionExerciseInput' }
    UpdateSessionRequest:
      type: object
      properties:
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: [string, 'null'], format: date-time }
        surface: { type: [string, 'null'], maxLength: 50 }
        focus: { type: [string, 'null'], maxLength: 200 }
        intensity: { oneOf: [{ $ref: '#/components/schemas/Intensity' }, { type: 'null' }] }
        workRiderUserId: { type: integer, format: int64 }
        riderWarningAcknowledged: { type: boolean, default: false }
    SessionSummary:
      type: object
      required: [id, sessionCode, horse, programId, phaseName, scheduledStart, status, workRider, blocked, blockedReasons]
      properties:
        id: { type: integer, format: int64 }
        sessionCode: { type: string, maxLength: 20 }
        horse: { $ref: '#/components/schemas/HorseRef' }
        programId: { type: integer, format: int64 }
        phaseName: { type: string }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/SessionStatus' }
        workRider: { $ref: '#/components/schemas/UserRef' }
        trainer: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        preCheckResult:
          type: [string, 'null']
          enum: [ALL_NORMAL, ABNORMAL, null]
          description: NULL until the Groom has checked.
        blocked: { type: boolean, description: Derived; true when the session cannot start now. }
        blockedReasons:
          type: array
          items: { $ref: '#/components/schemas/BlockedReason' }
        blockedMessage: { type: [string, 'null'], description: Human-readable reason (Vet reason for LOCKED). }
    SessionExercise:
      allOf:
        - type: object
          required: [id, exerciseName]
          properties:
            id: { type: integer, format: int64 }
            exerciseName: { type: string }
            exerciseType: { type: [string, 'null'] }
            suitabilityCategory: { oneOf: [{ $ref: '#/components/schemas/SuitabilityCategory' }, { type: 'null' }] }
        - $ref: '#/components/schemas/SessionExerciseInput'
    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required: [exercises, trainingAvailability]
          properties:
            horseProgramPhaseId: { type: integer, format: int64 }
            surface: { type: [string, 'null'] }
            focus: { type: [string, 'null'] }
            intensity: { oneOf: [{ $ref: '#/components/schemas/Intensity' }, { type: 'null' }] }
            actualStart: { type: [string, 'null'], format: date-time }
            actualEnd: { type: [string, 'null'], format: date-time }
            interruptionReason: { type: [string, 'null'] }
            trainingAvailability: { $ref: '#/components/schemas/TrainingAvailability' }
            exercises:
              type: array
              items: { $ref: '#/components/schemas/SessionExercise' }
            preSessionCheck: { oneOf: [{ $ref: '#/components/schemas/PreSessionCheck' }, { type: 'null' }] }
            linkedIncidentIds:
              type: array
              items: { type: integer, format: int64 }
            hasRiderFeedback: { type: boolean }
            hasEvaluation: { type: boolean }
            createdBy: { $ref: '#/components/schemas/UserRef' }
    SuitabilityResult:
      type: object
      required: [trainingAvailability, sessionBlocked, exercises, sessionIssues]
      properties:
        trainingAvailability: { $ref: '#/components/schemas/TrainingAvailability' }
        sessionBlocked: { type: boolean, description: True when LOCKED (BR-D20); no exercise detail is evaluated. }
        blockedMessage: { type: [string, 'null'], description: The Veterinarian's reason. }
        exercises:
          type: array
          items:
            type: object
            required: [exerciseOrder, exerciseDefinitionId, messages]
            properties:
              exerciseOrder: { type: integer }
              exerciseDefinitionId: { type: integer, format: int64 }
              category: { oneOf: [{ $ref: '#/components/schemas/SuitabilityCategory' }, { type: 'null' }], description: NULL = no issue. }
              messages:
                type: array
                items: { type: string }
              allowedActions:
                type: array
                description: For category A only REMOVE and REPLACE (BR-D32).
                items: { type: string, enum: [REMOVE, REPLACE, ACKNOWLEDGE, GIVE_REASON] }
        sessionIssues:
          type: array
          description: Session-level findings, e.g. category B rider schedule conflict, intensity outside the phase range.
          items:
            type: object
            required: [category, message]
            properties:
              category: { $ref: '#/components/schemas/SuitabilityCategory' }
              field: { type: [string, 'null'] }
              message: { type: string }
    StopSessionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        medicallyRelevant: { type: boolean, default: false }
        incidentType: { $ref: '#/components/schemas/IncidentType' }
        observedSeverity: { $ref: '#/components/schemas/ObservedSeverity' }
    ReportIssueRequest:
      type: object
      required: [incidentType, observedSeverity, description]
      properties:
        incidentType: { $ref: '#/components/schemas/IncidentType' }
        observedSeverity: { $ref: '#/components/schemas/ObservedSeverity' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        observedAt: { type: string, format: date-time, description: Defaults to now. }

    # ---------- Groom pre-session check ----------
    PreSessionCheckRequest:
      type: object
      additionalProperties: false
      required: [checks]
      properties:
        checks:
          $ref: '#/components/schemas/PreSessionCheckChecklist'
    PreSessionCheckChecklist:
      type: object
      description: Exactly one item for each key; overallResult is computed by the backend.
      additionalProperties: false
      required: [GENERAL_CONDITION, APPETITE_BEHAVIOUR, LEGS_HOOVES, MOVEMENT, TEMPERATURE]
      properties:
        GENERAL_CONDITION: { $ref: '#/components/schemas/PreSessionCheckItem' }
        APPETITE_BEHAVIOUR: { $ref: '#/components/schemas/PreSessionCheckItem' }
        LEGS_HOOVES: { $ref: '#/components/schemas/PreSessionCheckItem' }
        MOVEMENT: { $ref: '#/components/schemas/PreSessionCheckItem' }
        TEMPERATURE: { $ref: '#/components/schemas/PreSessionCheckItem' }
    PreSessionCheckItem:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: { type: string, enum: [NORMAL, ABNORMAL] }
        observation: { type: string, maxLength: 1000 }
    PreSessionCheck:
      type: object
      required: [id, sessionId, checks, overallResult, performedBy, performedAt]
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        checks: { $ref: '#/components/schemas/PreSessionCheckChecklist' }
        overallResult: { type: string, enum: [ALL_NORMAL, ABNORMAL] }
        performedBy: { $ref: '#/components/schemas/UserRef' }
        performedAt: { type: string, format: date-time }
    ReduceIntensityRequest:
      type: object
      required: [intensity]
      properties:
        intensity: { $ref: '#/components/schemas/Intensity' }

    # ---------- Work Rider feedback ----------
    RiderFeedbackRequest:
      type: object
      description: Prompts adapt to the outcome (BR-D23). `preInterruptionDescription` applies to INTERRUPTED sessions.
      required: [responses]
      properties:
        responses:
          type: object
          properties:
            horseResponse: { type: [string, 'null'], maxLength: 500 }
            balance: { type: [string, 'null'], maxLength: 500 }
            breathing: { type: [string, 'null'], maxLength: 500 }
            strideFeeling: { type: [string, 'null'], maxLength: 500 }
            abnormalBehavior: { type: [string, 'null'], maxLength: 500 }
            preInterruptionDescription: { type: [string, 'null'], maxLength: 1000 }
            notes: { type: [string, 'null'], maxLength: 1000 }
    RiderFeedback:
      allOf:
        - $ref: '#/components/schemas/RiderFeedbackRequest'
        - type: object
          required: [id, sessionId, submittedBy, submittedAt]
          properties:
            id: { type: integer, format: int64 }
            sessionId: { type: integer, format: int64 }
            submittedBy: { $ref: '#/components/schemas/UserRef' }
            submittedAt: { type: string, format: date-time }

    # ---------- Realtime ----------
    MetricSampleInput:
      type: object
      description: At least one of heartRate, speed, distance (ck_training_metric_sample__has_value). Accepted while IN_PROGRESS or PAUSED.
      required: [recordedAt]
      properties:
        recordedAt: { type: string, format: date-time }
        heartRate: { type: [integer, 'null'], minimum: 0, description: Beats per minute. }
        speedKmh: { type: [number, 'null'], minimum: 0, description: Field name denotes km/h. }
        distanceM: { type: [number, 'null'], minimum: 0, description: Field name denotes metres; distance semantics remain OPEN pending approval. }
    MetricSampleResult:
      type: object
      required: [sampleId, realtimeState]
      properties:
        sampleId: { type: integer, format: int64 }
        realtimeState: { $ref: '#/components/schemas/RealtimeState' }
        alertId: { type: [integer, 'null'], format: int64, description: Set when a CRITICAL alert was stored. }
    MonitoringAlert:
      type: object
      required: [id, sessionId, metric, metricValue, thresholdApplied, severity, raisedAt]
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        metric: { type: string, const: HEART_RATE }
        metricValue: { type: number }
        thresholdApplied: { type: number }
        severity: { type: string, const: CRITICAL }
        raisedAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        acknowledgedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        actionTaken: { oneOf: [{ $ref: '#/components/schemas/AlertAction' }, { type: 'null' }] }
        escalatedToVetAt: { type: [string, 'null'], format: date-time }
    AcknowledgeAlertRequest:
      type: object
      required: [action]
      properties:
        action: { $ref: '#/components/schemas/AlertAction' }
        intensity: { $ref: '#/components/schemas/Intensity', description: Required for REDUCE_INTENSITY; strictly lower than current intensity. }
        stopReason: { type: [string, 'null'], maxLength: 1000, description: Required when action = STOP. }
        medicallyRelevant: { type: boolean, default: false, description: "With STOP, creates an incident for Vet review." }

    # ---------- Evaluation ----------
    EvaluationRequest:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [MET, PARTIALLY_MET, NOT_MET] }
        evaluatedSummary: { type: [string, 'null'], maxLength: 2000 }
        evaluationNotes: { type: [string, 'null'], maxLength: 2000 }
        recommendation: { type: [string, 'null'], maxLength: 2000, description: Forward recommendation (M11). }
    SessionResult:
      allOf:
        - $ref: '#/components/schemas/EvaluationRequest'
        - type: object
          required: [id, sessionId, evaluatedBy, evaluatedAt]
          properties:
            id: { type: integer, format: int64 }
            sessionId: { type: integer, format: int64 }
            evaluatedBy: { $ref: '#/components/schemas/UserRef' }
            evaluatedAt: { type: string, format: date-time }
    SessionResultView:
      type: object
      required: [session, actual, alerts]
      properties:
        session: { $ref: '#/components/schemas/SessionDetail' }
        actual:
          type: object
          properties:
            durationMin: { type: [number, 'null'] }
            totalDistanceM: { type: [number, 'null'], description: Field name denotes metres; aggregation semantics remain OPEN pending approval. }
            maxHeartRate: { type: [integer, 'null'] }
            avgHeartRate: { type: [number, 'null'] }
            maxSpeedKmh: { type: [number, 'null'], description: Field name denotes km/h. }
            avgSpeedKmh: { type: [number, 'null'], description: Field name denotes km/h. }
            sampleCount: { type: integer, minimum: 0 }
            simulated: { type: boolean, description: True when any sample came from the simulator. }
        samples:
          type: array
          description: Time series for charts.
          items:
            type: object
            required: [recordedAt, source]
            properties:
              recordedAt: { type: string, format: date-time }
              heartRate: { type: [integer, 'null'] }
              speedKmh: { type: [number, 'null'], description: Field name denotes km/h. }
              distanceM: { type: [number, 'null'], description: Field name denotes metres; distance semantics remain OPEN pending approval. }
              source: { type: string, enum: [MANUAL, SIMULATOR] }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/MonitoringAlert' }
        riderFeedback: { oneOf: [{ $ref: '#/components/schemas/RiderFeedback' }, { type: 'null' }] }
        evaluation: { oneOf: [{ $ref: '#/components/schemas/SessionResult' }, { type: 'null' }] }
    PerformancePoint:
      type: object
      required: [sessionId, sessionCode, date, status]
      properties:
        sessionId: { type: integer, format: int64 }
        sessionCode: { type: string }
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/SessionStatus' }
        totalDistanceM: { type: [number, 'null'], description: Field name denotes metres; aggregation semantics remain OPEN pending approval. }
        durationMin: { type: [number, 'null'] }
        maxHeartRate: { type: [integer, 'null'] }
        avgSpeedKmh: { type: [number, 'null'], description: Field name denotes km/h. }
        result:
          description: Null when no Trainer evaluation has been recorded; when present, this is the required evaluation result.
          oneOf:
            - type: string
              enum: [MET, PARTIALLY_MET, NOT_MET]
            - type: 'null'
