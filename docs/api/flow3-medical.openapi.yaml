components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    horseId:
      name: horseId
      in: path
      required: true
      description: SQL BIGINT primary key; positive JSON integer.
      schema:
        type: integer
        format: int64
        minimum: 1
    incidentId:
      name: incidentId
      in: path
      required: true
      description: SQL BIGINT primary key; positive JSON integer.
      schema:
        type: integer
        format: int64
        minimum: 1
    caseId:
      name: caseId
      in: path
      required: true
      description: SQL BIGINT primary key; positive JSON integer.
      schema:
        type: integer
        format: int64
        minimum: 1
    restrictionId:
      name: restrictionId
      in: path
      required: true
      description: SQL BIGINT primary key; positive JSON integer.
      schema:
        type: integer
        format: int64
        minimum: 1
    taskId:
      name: taskId
      in: path
      required: true
      description: SQL BIGINT primary key; positive JSON integer.
      schema:
        type: integer
        format: int64
        minimum: 1
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based page
    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'
    HealthStatus:
      type: string
      enum:
        - FIT
        - MONITORING
        - INJURED
        - QUARANTINED
    RestrictionLevel:
      type: string
      enum:
        - LIMITED
        - LOCKED
      description: Persisted medical_restriction.restriction_level; AVAILABLE is never persisted.
    TrainingAvailability:
      type: string
      enum:
        - AVAILABLE
        - LIMITED
        - LOCKED
      readOnly: true
    RecoveryStatus:
      type: string
      enum:
        - NOT_RECOVERED
        - IMPROVING
        - RECOVERED
    BaselineExaminationRequest:
      type: object
      properties:
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 9999.99
          multipleOf: 0.01
          description: Kilograms; dbo.weight_record.weight DECIMAL(6,2).
        healthStatus:
          $ref: '#/components/schemas/HealthStatus'
        clinicalNotes:
          type: string
          description: Maps to veterinary_examination.findings; not a separate clinical_notes column.
      additionalProperties: false
      required:
        - weightKg
        - healthStatus
    WeightRecordRequest:
      type: object
      properties:
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 9999.99
          multipleOf: 0.01
          description: Kilograms; dbo.weight_record.weight DECIMAL(6,2).
        recordedAt:
          type: string
          format: date-time
          description: Maps to measured_at; omitted value uses server UTC time; future values rejected.
      additionalProperties: false
      required:
        - weightKg
    IncidentCreateRequest:
      type: object
      properties:
        horseId:
          type: integer
          format: int64
          minimum: 1
        preSessionCheckId:
          type: integer
          format: int64
          minimum: 1
        trainingSessionId:
          type: integer
          format: int64
          minimum: 1
        careTaskId:
          type: integer
          format: int64
          minimum: 1
        incidentType:
          $ref: '#/components/schemas/IncidentType'
        observedSeverity:
          $ref: '#/components/schemas/ObservedSeverity'
        description:
          type: string
          maxLength: 2000
        observedAt:
          type: string
          format: date-time
          description: UTC timestamp; SQL DATETIME2(3).
      additionalProperties: false
      required:
        - horseId
        - incidentType
        - observedSeverity
        - observedAt
      description: Explicit Report Incident or Report Issue only. An ABNORMAL pre-session check is persisted, leaves its Session SCHEDULED and blocks Start; it does not automatically create an Incident. The optional context IDs identify the same horse and authorized work context. ck_incident__single_source_context allows zero or one source, never two or three. Photos remain a separate incident_photo capability gap in the review register.
      allOf:
        - not:
            required:
              - preSessionCheckId
              - trainingSessionId
            properties:
              preSessionCheckId:
                type: integer
                format: int64
                minimum: 1
              trainingSessionId:
                type: integer
                format: int64
                minimum: 1
        - not:
            required:
              - preSessionCheckId
              - careTaskId
            properties:
              preSessionCheckId:
                type: integer
                format: int64
                minimum: 1
              careTaskId:
                type: integer
                format: int64
                minimum: 1
        - not:
            required:
              - trainingSessionId
              - careTaskId
            properties:
              trainingSessionId:
                type: integer
                format: int64
                minimum: 1
              careTaskId:
                type: integer
                format: int64
                minimum: 1
    IncidentReviewRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - OPEN_CASE
            - LINK_CASE
            - RESOLVE
        medicalCaseId:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
      required:
        - action
      description: OPEN_CASE and LINK_CASE require a REPORTED unlinked Incident and transition it to UNDER_REVIEW; OPEN_CASE creates an OPEN same-horse case, while LINK_CASE requires an existing OPEN same-horse case. RESOLVE accepts REPORTED or UNDER_REVIEW and transitions to terminal RESOLVED without changing a linked case or closing it. Re-review, backward transitions and case relinking return 409. No comment column exists.
      oneOf:
        - properties:
            action:
              const: OPEN_CASE
            medicalCaseId:
              type: integer
              format: int64
              minimum: 1
          not:
            required:
              - medicalCaseId
            properties:
              medicalCaseId:
                type: integer
                format: int64
                minimum: 1
        - properties:
            action:
              const: LINK_CASE
            medicalCaseId:
              type: integer
              format: int64
              minimum: 1
          required:
            - medicalCaseId
        - properties:
            action:
              const: RESOLVE
            medicalCaseId:
              type: integer
              format: int64
              minimum: 1
          not:
            required:
              - medicalCaseId
            properties:
              medicalCaseId:
                type: integer
                format: int64
                minimum: 1
    MedicalCaseCreateRequest:
      type: object
      properties:
        horseId:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          maxLength: 2000
          minLength: 1
          description: Maps to medical_case.condition_summary for an independent case.
      additionalProperties: false
      required:
        - horseId
        - reason
    ExaminationRequest:
      type: object
      properties:
        symptoms:
          type: string
          minLength: 1
          description: Maps to veterinary_examination.findings.
        diagnosis:
          type: string
          maxLength: 1000
        severity:
          $ref: '#/components/schemas/ClinicalSeverity'
        examinedAt:
          type: string
          format: date-time
          description: UTC timestamp; SQL DATETIME2(3).
        healthStatus:
          $ref: '#/components/schemas/HealthStatus'
          description: Atomically sets horse.health_status and veterinary_examination.health_status_set; Veterinarian only.
        bodyCondition:
          type: string
          maxLength: 500
      additionalProperties: false
      required:
        - symptoms
        - examinedAt
    InjuryRequest:
      type: object
      properties:
        bodyRegion:
          type: string
          maxLength: 100
          minLength: 1
          description: Free NVARCHAR(100); no approved body-region code taxonomy was supplied.
        severity:
          $ref: '#/components/schemas/ClinicalSeverity'
        recoveryStatus:
          $ref: '#/components/schemas/RecoveryStatus'
        veterinaryExaminationId:
          type: integer
          format: int64
          minimum: 1
        position3d:
          type: string
          maxLength: 100
          description: Opaque VARCHAR(100) marker stored verbatim as position_3d. Coordinate serialization/model reference requires decision G4; no invented x/y/z persistence.
        side:
          type: string
          maxLength: 20
      additionalProperties: false
      required:
        - bodyRegion
        - severity
        - recoveryStatus
    TreatmentPlanRequest:
      type: object
      properties:
        treatmentMedicationInstructions:
          type: string
          minLength: 1
          description: Maps to treatment_medication_instructions NVARCHAR(MAX). Veterinarian-only clinical content.
        restInstructions:
          type: string
          maxLength: 100
          description: Maps to rest_period.
        careInstructions:
          type: string
          maxLength: 2000
          description: Maps to care_instructions; explicitly authorized operational instructions only.
        groomTasks:
          type: array
          items:
            $ref: '#/components/schemas/GroomTaskInstruction'
        reexaminationDate:
          type: string
          format: date
      additionalProperties: false
