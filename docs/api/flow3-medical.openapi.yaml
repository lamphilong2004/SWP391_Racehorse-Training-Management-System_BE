              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'UNAUTHORIZED: missing, invalid or expired JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'FORBIDDEN: role or row scope denied; inactive authenticated account denied.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'NOT_FOUND: visible resource does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'CONFLICT or BUSINESS_RULE_VIOLATION: invalid transition, repeated review, linked case conflict, wrong horse or CLOSED case.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
        - $ref: '#/components/parameters/incidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentReviewRequest'
      x-implementation-task: CORE-026
