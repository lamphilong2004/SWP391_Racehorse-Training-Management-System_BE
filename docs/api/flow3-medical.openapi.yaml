  /api/incidents/{incidentId}/review:
    post:
      operationId: reviewIncident
      tags:
        - Incidents
      summary: 'Vet reviews incident: open case, link case or resolve'
      description: |
        VETERINARIAN only. Persist incident.reviewed_by_user_id from JWT, medical_case_id and status atomically.
        OPEN_CASE requires a REPORTED incident with no linked case; create an OPEN MedicalCase for the same horse,
        link it and transition to UNDER_REVIEW. LINK_CASE requires a REPORTED incident with no linked case and an
        existing OPEN MedicalCase for the same horse; link it and transition to UNDER_REVIEW. RESOLVE permits
        REPORTED or UNDER_REVIEW to transition to RESOLVED, preserving any case link; it never closes the case.
        RESOLVED is terminal. Re-review, backward transitions, changing a linked case and auto-reopen are forbidden.
        Invalid source state, existing/wrong-horse/CLOSED case link or repeated review returns 409.
      x-state-transitions:
        $ref: '#/x-approved-flow3-decisions/incidentReview'
      x-roles:
        - VETERINARIAN
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
