openapi: 3.1.0
info:
  title: Racehorse Training & Management System — Flow 3 Medical API
  version: 0.1.0
  description: CORE-006 contract review revision. Current persistence mappings follow DB-01 except the Leader-approved care_task.assigned_groom_user_id addition, which requires a separate migration. Shared errors and the merged seven-role permission matrix apply. Existing medical paths are retained for consumers; the exercise-rule operation follows the same restriction resource. This contract is submitted for team review, not a claim of runtime implementation. Exact source provenance and remaining business/schema gaps are recorded in CORE-006-review.md. All writes require backend JWT identity and role/scope checks; actor IDs and server timestamps cannot be supplied by clients.
  contact:
    name: SWP391 Racehorse team
servers:
  - url: http://localhost:8080
    description: Development only
security:
  - bearerAuth: []
tags:
  - name: Baseline
    description: Flow 1 veterinarian initial health examination (CORE-014 implementation)
  - name: Incidents
    description: Incident reporting and veterinarian handling (CORE-026 and CORE-035)
  - name: Medical Cases
    description: Medical cases, exams, injury records and recovery (CORE-035)
  - name: Treatments
    description: Treatment plans and approved Groom treatment acknowledgements (CORE-035)
  - name: Restrictions
    description: Derived training availability and veterinarian medical restrictions (CORE-019 implementation owned by Ngô Minh Tiến)
  - name: Herd Health
    description: Veterinarian health overview (CORE-035)
  - name: Thresholds
    description: CORE-019 owns effective HEART_RATE reads and horse override GET/PUT/END; CORE-030 consumes the resolved threshold. Global defaults are managed application configuration; 180 bpm is demo seed only.
x-downstream-ownership:
  CORE-019: Ngô Minh Tiến
  CORE-026: Ngô Minh Tiến
  CORE-035: Ngô Minh Tiến
  CORE-045: Ngô Minh Tiến
  CORE-046: Nguyễn Đình Minh Đức
x-approved-flow3-decisions:
  incidentReview:
    transitions:
      OPEN_CASE:
        from: [REPORTED]
        to: UNDER_REVIEW
        requiresUnlinkedIncident: true
        caseDisposition: CREATE_OPEN_SAME_HORSE
      LINK_CASE:
        from: [REPORTED]
        to: UNDER_REVIEW
        requiresUnlinkedIncident: true
        caseDisposition: LINK_EXISTING_OPEN_SAME_HORSE
      RESOLVE:
        from: [REPORTED, UNDER_REVIEW]
        to: RESOLVED
        preservesLinkedCase: true
        closesMedicalCase: false
    terminalState: RESOLVED
    reviewedByUserIdSource: JWT
    invalidReviewHttpStatus: 409
  medicalCaseClosure:
    requiresStatus: OPEN
    minimumClinicalExaminations: 1
    clinicalExaminationTypes: [EXAMINATION, RE_EXAMINATION]
    recoveryGate:
      whenAny: [INJURY_EXISTS, TREATMENT_PLAN_EXISTS]
      minimumReexaminations: 1
      latestRecoveryOutcome: RECOVERED
    treatmentTasksCompleteIfPlanExists: true
    linkedRestrictionsLifted: true
    linkedIncidentsResolved: true
    injuryRecoveryStatusIndependentGate: false
    cascadeIncidentResolve: false
    cascadeRestrictionLift: false
    cascadeGroomCompletion: false
    invalidCloseHttpStatus: 409
  restrictionEffectiveAt:
    futureAllowed: false
    compareTo: SERVER_NOW
    futureErrorHttpStatus: 400
    futureErrorCode: VALIDATION_ERROR
    effectiveImmediatelyOnCreate: true
  abnormalPreSessionCheck:
    persistCheck: true
    overallResult: ABNORMAL
    sessionState: SCHEDULED
    startBlocked: true
    incidentCreation: EXPLICIT_ONLY
  treatmentGroomAssignment:
    schemaAdditionApproved: care_task.assigned_groom_user_id BIGINT NULL FK app_user(id)
    treatmentTaskRequiresAssignedGroom: true
    completedByUserIdSource: JWT
    migrationImplementedInCore006: false
  restrictionExerciseGate:
    locked: BLOCK_ALL
    limitedProhibited: DENY_FIRST
    limitedWithAllowedRules: REQUIRE_ALLOWED_MATCH_AND_NO_PROHIBITED_MATCH
    limitedWithoutAllowedRules: ALLOW_UNLESS_PROHIBITED
  thresholdResolution:
    owner: CORE-019
    consumer: CORE-030
    globalSource: MANAGED_APPLICATION_CONFIG
    demoSeedBpm: 180
    warningFormulaFromCritical: NONE
