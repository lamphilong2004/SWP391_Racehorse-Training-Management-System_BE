# Preparation only. Applying this Blueprint creates a service; approval and SQL staging are prerequisites.
services:
  - type: web
    name: racehorse-be-staging
    runtime: docker
    plan: free
    repo: https://github.com/lamphilong2004/SWP391_Racehorse-Training-Management-System_BE
    branch: dev
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: 'off'
    # Process liveness; staging startup still requires the private SQL route and Hibernate validate.
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: DB_URL
        value: jdbc:sqlserver://127.0.0.1:11433;databaseName=racehorse_demo;encrypt=true;trustServerCertificate=false;hostNameInCertificate=PHILONG-100604;loginTimeout=10
      - key: TS_AUTHKEY
        sync: false
      - key: TRUSTSTORE_PASSWORD
        sync: false
      - key: TRUSTSTORE_BASE64_FILE
        value: /etc/secrets/racehorse-truststore.p12.b64
      - key: NETWORK_STARTUP_TIMEOUT_SECONDS
        value: '60'
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
      - key: JWT_ACCESS_TOKEN_TTL_SECONDS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: STAGING_DOCS_USERNAME
        sync: false
      - key: STAGING_DOCS_PASSWORD
        sync: false
