# Preparation only. Applying this Blueprint creates a service; approval and SQL staging are prerequisites.
services:
  - type: web
    name: racehorse-be-staging
    runtime: docker
    plan: free
    repo: https://github.com/lamphilong2004/SWP391_Racehorse-Training-Management-System_BE
    branch: dev
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health/ready
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
      - key: JWT_ACCESS_TOKEN_TTL_SECONDS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: STAGING_DOCS_USERNAME
        sync: false
      - key: STAGING_DOCS_PASSWORD
        sync: false
