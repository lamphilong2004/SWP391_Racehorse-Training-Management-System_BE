spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 5000
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate

server:
  address: 0.0.0.0
  port: ${PORT:10000}
  shutdown: graceful

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  staging:
    docs-username: ${STAGING_DOCS_USERNAME}
    docs-password: ${STAGING_DOCS_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: false
