# CORE-007 test settings, merged over src/test/resources/application-test.yml (CORE-001) — config/ has higher precedence.
spring:
  jpa:
    hibernate:
      # H2 cannot run the SQL Server schema (filtered indexes); tests let Hibernate create the mapped tables.
      # The real schema is validated with ddl-auto=validate on the dev profile against SQL Server.
      ddl-auto: create-drop

app:
  jwt:
    # Test-only key (not a secret, never used outside the test profile).
    secret: test-only-jwt-signing-key-0123456789-abcdefghij
    expires-in: PT15M
  security:
    public-api-docs: false
